<section class="insta-banner">
  <div class="container insta-container">
    
    <div class="insta-info">
      <i class="fab fa-instagram insta-icon"></i>
      <div class="insta-text">
        <span class="subtitle">SE INSPIRE</span>
        <h3 class="title">Siga a Sol & Mar no Instagram</h3>
      </div>
    </div>

    <a [href]="instagramUrl" target="_blank" rel="noopener noreferrer" class="insta-btn">
      {{ instagramHandle }}
    </a>

  </div>
</section>

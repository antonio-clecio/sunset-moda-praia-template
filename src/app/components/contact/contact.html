<section class="contact-section">
  <div class="container">

    <!-- Título e Subtítulo -->
    <h2 class="title">Vamos conversar?</h2>
    <p class="subtitle">Chama no WhatsApp e a gente te ajuda a escolher a peça certa.</p>

    <!-- Botão do WhatsApp -->
    <a [href]="whatsappUrl" target="_blank" rel="noopener noreferrer" class="whatsapp-btn">
      <i class="fab fa-whatsapp"></i>
      Falar no WhatsApp
    </a>

    <!-- Informações de Contato -->
    <div class="info-grid">
      <div class="info-item">
        <h4>ENDEREÇO</h4>
        <p>Gama Shopping - Loja B 136<br>Setor Central, Gama - DF</p>
      </div>

      <div class="info-item">
        <h4>HORÁRIO</h4>
        <p>Seg–Sáb, 09h às 18h</p>
      </div>

      <div class="info-item">
        <h4>INSTAGRAM</h4>
        <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">@solemarmodapraia</a>
      </div>
    </div>

    <!-- Mapa do Google -->
    <div class="map-wrapper">
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3836.852906103603!2d-48.0660!3d-16.0202!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x935a2cc9458dfa7b%3A0xa19f07a2a19b8df7!2sGama%20Shopping!5e0!3m2!1spt-BR!2sbr!4v1700000000000!5m2!1spt-BR!2sbr"
        width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>

  </div>
</section>

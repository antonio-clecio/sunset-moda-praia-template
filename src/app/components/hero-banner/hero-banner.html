<section class="hero-carousel">
  <!-- Container dos Banners -->
  <div class="carousel-slides" [style.transform]="'translateX(-' + (currentSlide * 100) + '%)'">
    @for (slide of slides; track $index) {
    <div class="slide-item" (click)="onBannerClick(slide.categorySlug)">
      <img [src]="slide.imageUrl" [alt]="slide.altText" class="banner-image" />
    </div>
    }
  </div>

  <!-- Seta Anterior -->
  <button type="button" class="carousel-arrow prev" (click)="onUserPrev(); $event.stopPropagation()"
    aria-label="Slide anterior">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <!-- Seta Próximo -->
  <button type="button" class="carousel-arrow next" (click)="onUserNext(); $event.stopPropagation()"
    aria-label="Próximo slide">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>

  <!-- Indicadores inferiores (Dots Centralizados) -->
  <div class="carousel-dots">
    @for (slide of slides; track $index) {
    <button type="button" class="dot" [class.active]="$index === currentSlide"
      (click)="onUserGoTo($index); $event.stopPropagation()"
      [attr.aria-label]="'Ir para o slide ' + ($index + 1)"></button>
    }
  </div>
</section>

<!-- Barra rosa -->
<div class="top-bar">
  <span>Entrega em todo o entorno · Seg–Sáb, 09h às 18h ♡</span>
</div>

<header>
  <div class="container">
    <div class="header-grid">
      <!-- Botão Hambúrguer (Oculto no Desktop, visível no Mobile) -->
      <button class="hamburger-btn" (click)="toggleMenu()" aria-label="Abrir Menu">
        <i class="fas" [class.fa-bars]="!isMenuOpen" [class.fa-times]="isMenuOpen"></i>
      </button>

      <!-- Busca (Esquerda no Desktop, linha de baixo no Mobile) -->
      <div class="search-box">
        <input type="text" placeholder="O que você procura?" [value]="searchTerm" (input)="onSearch($event)" />
        <i class="fas fa-search"></i>
      </div>

      <!-- Logo (Centralizada) -->
      <div class="logo">
        Sol&Mar
        <span>MODA PRAIA</span>
      </div>

      <!-- Espaço vazio à direita para equilibrar a Grid no Desktop -->
      <div class="header-right-spacer"></div>
    </div>

    <!-- NAVBAR DESKTOP -->
    <div class="scroll-wrapper nav-wrapper desktop-nav">
      <nav class="main-nav">
        <a (click)="selectCategory('todos')" [class.active]="selectedCategory === 'todos'">Todos</a>
        <a (click)="selectCategory('biquini')" [class.active]="selectedCategory === 'biquini'">Biquini</a>
        <a (click)="selectCategory('maio')" [class.active]="selectedCategory === 'maio'">Maiô</a>
        <a (click)="selectCategory('saida')" [class.active]="selectedCategory === 'saida'">Saída de Praia</a>
        <a (click)="selectCategory('conjunto')" [class.active]="selectedCategory === 'conjunto'">Conjunto Fitness</a>
        <a (click)="selectCategory('macacao')" [class.active]="selectedCategory === 'macacao'">Macacão</a>
        <a (click)="selectCategory('jaqueta')" [class.active]="selectedCategory === 'jaqueta'">Jaqueta</a>
        <a (click)="selectCategory('blusa')" [class.active]="selectedCategory === 'blusa'">Blusa</a>
        <a (click)="selectCategory('calca')" [class.active]="selectedCategory === 'calca'">Calça</a>
      </nav>
    </div>
  </div>
</header>

<!-- GAVETA LATERAL DO MENU MOBILE -->
<div class="mobile-overlay" [class.open]="isMenuOpen" (click)="closeMenu()"></div>

<aside class="mobile-drawer" [class.open]="isMenuOpen">
  <div class="drawer-header">
    <span>Categorias</span>
    <button (click)="closeMenu()" class="close-drawer-btn">&times;</button>
  </div>

  <nav class="mobile-nav">
    <a (click)="selectCategory('todos')" [class.active]="selectedCategory === 'todos'">Todos</a>
    <a (click)="selectCategory('biquini')" [class.active]="selectedCategory === 'biquini'">Biquini</a>
    <a (click)="selectCategory('maio')" [class.active]="selectedCategory === 'maio'">Maiô</a>
    <a (click)="selectCategory('saida')" [class.active]="selectedCategory === 'saida'">Saída de Praia</a>
    <a (click)="selectCategory('conjunto')" [class.active]="selectedCategory === 'conjunto'">Conjunto Fitness</a>
    <a (click)="selectCategory('macacao')" [class.active]="selectedCategory === 'macacao'">Macacão</a>
    <a (click)="selectCategory('jaqueta')" [class.active]="selectedCategory === 'jaqueta'">Jaqueta</a>
    <a (click)="selectCategory('blusa')" [class.active]="selectedCategory === 'blusa'">Blusa</a>
    <a (click)="selectCategory('calca')" [class.active]="selectedCategory === 'calca'">Calça</a>
  </nav>
</aside>
